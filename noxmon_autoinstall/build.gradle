plugins {
    id 'com.android.library'
}

android {
    namespace 'noxmon.autoinstall'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdkVersion 21
    }

    buildTypes {
        debug {}
        proguard {
            initWith debug
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }
        release {}
        gplay {
            initWith release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

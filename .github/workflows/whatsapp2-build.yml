name: Build WhatsApp 2 APK

on:
  push:
    branches: [whatsapp2-apk-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          rm -rf whatsapp2-build
          mkdir -p whatsapp2-build/app/src/main/java/com/nox/whatsapp2
          mkdir -p whatsapp2-build/app/src/main/assets
          mkdir -p whatsapp2-build/app/src/main/res/drawable
          mkdir -p whatsapp2-build/app/src/main/res/values

          cat > whatsapp2-build/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'WhatsApp2Conceito'
          include ':app'
          EOF

          cat > whatsapp2-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > whatsapp2-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nox.whatsapp2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nox.whatsapp2'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > whatsapp2-build/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="WhatsApp 2"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > whatsapp2-build/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B141A</item>
                  <item name="android:navigationBarColor">#0B141A</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > whatsapp2-build/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#25D366" android:pathData="M54,6A48,48 0,1 0,54 102A48,48 0,1 0,54 6"/>
              <path android:fillColor="#0B141A" android:pathData="M30,34C30,28 35,24 41,24H67C73,24 78,28 78,34V61C78,67 73,71 67,71H51L37,82V71H41C35,71 30,67 30,61Z"/>
              <path android:fillColor="#25D366" android:pathData="M42,41H66V46H42ZM42,51H66V56H42Z"/>
          </vector>
          EOF

          cat > whatsapp2-build/app/src/main/java/com/nox/whatsapp2/MainActivity.java <<'EOF'
          package com.nox.whatsapp2;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          echo '' | base64 -d | gzip -d > whatsapp2-build/app/src/main/assets/index.html

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: whatsapp2-build
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp whatsapp2-build/app/build/outputs/apk/debug/app-debug.apk WhatsApp2-v2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WhatsApp2-v2-APK
          path: WhatsApp2-v2.apk
          if-no-files-found: error

name: Build Urna APK

on:
  push:
    branches:
      - build-urna-simulador-apk
    paths:
      - 'urna-simulador-android/**'
      - '.github/workflows/build-urna-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urna-simulador-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Urna-Simulador-2026.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Urna-Simulador-2026
          path: urna-simulador-android/app/build/outputs/apk/debug/Urna-Simulador-2026.apk
          if-no-files-found: error

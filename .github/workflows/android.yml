name: Lap Launcher APK

on:
  push:
    branches: [v3_openjdk]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lap-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android tools
        run: sdkmanager "platforms;android-37" "ndk;27.3.13750724"
      - name: Download Java 8 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ github.token }}
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Prepare resources and test signing key
        run: |
          bash scripts/languagelist_updater.sh
          if [ ! -f app_pojavlauncher/debug.keystore ]; then
            keytool -genkeypair -keystore app_pojavlauncher/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Lap Launcher Debug" -keyalg RSA -validity 10000 -noprompt
          fi
      - name: Build APK
        run: gradle :app_pojavlauncher:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lap-Launcher-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
